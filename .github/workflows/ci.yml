name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # enable manual execution

concurrency:
  group: \${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v5

      - name: Set up Nix
        uses: cachix/install-nix-action@v31

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # Cache the standard store and its database, keyed by the toolchain.
          primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile LaTeX document
        run: nix develop --no-update-lock-file --command latexmk -pdf -interaction=nonstopmode -halt-on-error stirling.tex

      - name: Get next version
        if: github.ref == 'refs/heads/main'
        uses: reecetech/version-increment@2023.4.1
        id: version
        with:
          scheme: semver
          increment: minor

      - name: Create tag
        if: github.ref == 'refs/heads/main'
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.version.outputs.version }}

      - name: Create Github Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: stirling.pdf
